name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build, Lint & Test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm license-check
      - run: pnpm test ${{ matrix.os == 'ubuntu-latest' && '-- -- --coverage' || '' }}

      # The action-budget query filters on `date('now', 'localtime')`, so its
      # fixture must build the same local calendar day.  A UTC runner cannot
      # observe a disagreement — there the local and UTC days coincide by
      # construction, which is exactly why #942 stayed green in CI while
      # failing nightly on any developer machine at a non-zero offset.
      #
      # Two fixed-offset zones, because the seam only opens for part of a day
      # and which part depends on the sign of the offset: a machine at UTC+14
      # has already rolled over for UTC hours 10-23, one at UTC-11 has not yet
      # rolled over for hours 00-10.  Their union is every hour of every day,
      # so the pair cannot pass vacuously whenever CI happens to run.
      #
      # That argument holds only while both zones resolve to the offsets it
      # assumes, so the step asserts them rather than trusting them.  Missing
      # tzdata makes `tzset()` fall back to UTC, which would quietly reduce
      # this step to a second copy of the UTC run above and still exit 0; the
      # same assertion also catches either zone acquiring DST or being
      # re-pointed by a future tzdata release, both of which would move the
      # windows out from under the union above.  It reads the offset through
      # the C library because that is the resolver SQLite's `localtime`
      # modifier calls, and only a *two-sided* fallback can pass vacuously: if
      # just one of Node and the C library resolves the zone, the fixture and
      # the query disagree and the test fails loudly on its own.
      #
      # Invoked as the package script rather than `pnpm test`: the root script
      # is `turbo run test` across all four packages and cannot target a single
      # file, and only this one file is at stake here.
      #
      # One platform is enough — the seam is in how the fixture derives a date,
      # not in the OS — and ubuntu is where the rest of the coverage already
      # runs.  It must not be Windows in any case: an IANA zone name in `TZ` is
      # honoured by both Node and the C library on Linux and macOS, but not by
      # the Windows CRT, where the two would disagree for reasons that have
      # nothing to do with this code.
      - name: Timezone regression guard (action-budget)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Explicit, rather than leaning on the runner's default `bash -e`: a
          # `for` loop reports the exit status of its *last* iteration, so
          # without this a failure in the first zone would be masked by a pass
          # in the second.
          set -euo pipefail
          for spec in Pacific/Kiritimati:+1400 Pacific/Midway:-1100; do
            tz="${spec%%:*}"
            want="${spec##*:}"
            got="$(TZ="$tz" date +%z)"
            if [ "$got" != "$want" ]; then
              echo "::error::TZ=$tz resolved to UTC offset $got, expected $want."
              echo "The two zones no longer cover every hour, so this step would"
              echo "evaluate nothing rather than guard anything. Check tzdata."
              exit 1
            fi
            echo "--- TZ=$tz (UTC$want) ---"
            TZ="$tz" pnpm --filter @lhremote/core test src/db/repositories/action-budget.test.ts
          done

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  memory-freshness:
    name: Memory Freshness
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Grade the instrument before trusting its reading: if these fail, the
      # check below carries no information about the corpus.
      - name: Test the freshness checker
        run: python3 tools/check-memory-freshness.test.py

      # `--warn-only` reports drift and annotates the PR without failing the
      # build. It is here because one entry was already overdue when this job
      # landed, and the honest alternatives were to re-walk that memory (which
      # needs a licensed LinkedHelper install) or to bump its `last-verified`
      # date — which would fabricate a verification that never happened.
      # Drop the flag once the corpus is clean: see issue #912.
      #
      # The flag forgives measured drift and nothing else. Scanning zero
      # entries still fails, so a check that silently stops finding the corpus
      # cannot pass as a clean bill; and so does an entry whose frontmatter
      # cannot be graded at all, which has no age and so could never resurface
      # through the overdue path once the flag is dropped.
      - name: Check memory freshness frontmatter
        run: python3 tools/check-memory-freshness.py --warn-only

  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs:
      - ci

    steps:
      - uses: actions/checkout@v7

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - uses: ./.github/actions/setup
        with:
          skip-playwright: 'true'

      - name: Build packages
        run: pnpm build

      - name: Build docs
        run: |
          command -v pandoc || (sudo apt-get update && sudo apt-get install -y pandoc)

          mkdir -p build/gh-pages build/gh-pages/docs
          pandoc \
            -f gfm -t html5 -s --shift-heading-level-by=-1 --lua-filter=gh-pages/filter.lua -H gh-pages/header.html \
            -o build/gh-pages/index.html gh-pages/metadata.md README.md
          pandoc \
            -f gfm -t html5 -s --shift-heading-level-by=-1 --lua-filter=gh-pages/filter.lua -H gh-pages/header.html \
            -o build/gh-pages/docs/rate-limiting.html gh-pages/metadata.md docs/rate-limiting.md

          pnpm --filter @lhremote/core docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/gh-pages

  publish-github-pages:
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    needs:
      - package

    environment:
      name: github-pages
      url: ${{ steps.publish-github-pages.outputs.page_url }}

    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publish GitHub Pages
        id: publish-github-pages
        uses: actions/deploy-pages@v5
