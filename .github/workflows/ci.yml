name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build, Lint & Test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm license-check
      - run: pnpm test ${{ matrix.os == 'ubuntu-latest' && '-- -- --coverage' || '' }}
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  memory-freshness:
    name: Memory Freshness
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Grade the instrument before trusting its reading: if these fail, the
      # check below carries no information about the corpus.
      - name: Test the freshness checker
        run: python3 tools/check-memory-freshness.test.py

      # `--warn-only` reports drift and annotates the PR without failing the
      # build. It is here because one entry was already overdue when this job
      # landed, and the honest alternatives were to re-walk that memory (which
      # needs a licensed LinkedHelper install) or to bump its `last-verified`
      # date — which would fabricate a verification that never happened.
      # Drop the flag once the corpus is clean: see issue #912.
      #
      # Note this does NOT disable the whole gate. Scanning zero entries still
      # fails under `--warn-only`, so a check that silently stops finding the
      # corpus cannot pass as a clean bill.
      - name: Check memory freshness frontmatter
        run: python3 tools/check-memory-freshness.py --warn-only

  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs:
      - ci

    steps:
      - uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - uses: ./.github/actions/setup
        with:
          skip-playwright: 'true'

      - name: Build packages
        run: pnpm build

      - name: Build docs
        run: |
          command -v pandoc || (sudo apt-get update && sudo apt-get install -y pandoc)

          mkdir -p build/gh-pages build/gh-pages/docs
          pandoc \
            -f gfm -t html5 -s --shift-heading-level-by=-1 --lua-filter=gh-pages/filter.lua -H gh-pages/header.html \
            -o build/gh-pages/index.html gh-pages/metadata.md README.md
          pandoc \
            -f gfm -t html5 -s --shift-heading-level-by=-1 --lua-filter=gh-pages/filter.lua -H gh-pages/header.html \
            -o build/gh-pages/docs/rate-limiting.html gh-pages/metadata.md docs/rate-limiting.md

          pnpm --filter @lhremote/core docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/gh-pages

  publish-github-pages:
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    needs:
      - package

    environment:
      name: github-pages
      url: ${{ steps.publish-github-pages.outputs.page_url }}

    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publish GitHub Pages
        id: publish-github-pages
        uses: actions/deploy-pages@v5
